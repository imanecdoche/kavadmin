name: kavadmin
description: "KAVADMIN - Sistem Manajemen & Administrasi Kavio Edu"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Database
  firebase_core: ^3.3.0
  cloud_firestore: ^5.2.0
  shared_preferences: ^2.3.2

  # State Management & DI
  flutter_riverpod: ^2.5.1

  # Document Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2
  path_provider: ^2.1.4
  share_plus: ^10.0.2

  # UI & Utilities
  intl: ^0.19.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  flutter_lucide: ^1.37.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
